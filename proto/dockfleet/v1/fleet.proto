syntax = "proto3";

package dockfleet.v1;

option go_package = "github.com/dockfleet/dockfleet/internal/protocol/dockfleet/v1;dockfleetv1";

// NodeService is served by the manager and called by agents. Agents always
// dial the manager; the manager never connects to agents.
//
// Lifecycle:
//  1. RegisterNode: the agent announces its protocol version, identity and
//     capacity. The manager checks the version, persists the node and returns
//     a session_id plus the workloads currently assigned to the node.
//  2. Heartbeat (every heartbeat_interval_ms): the agent proves liveness and
//     reports the status of every workload it knows about. The manager answers
//     with the complete set of workloads assigned to the node, each with the
//     desired state its container must be brought to. Both sets are complete,
//     so every instruction is idempotent: an agent that receives the same set
//     twice, or after a restart, converges to the same containers.
//  3. DeregisterNode: the agent announces a clean shutdown so the manager can
//     stop placing work on the node immediately instead of waiting for a
//     timeout.
//
// Leases: the manager grants each session a lease of lease_ms, renewed by
// every successful Heartbeat. A node that stays silent is suspect, then
// unavailable, and only an unavailable node's workloads are started on other
// nodes. The manager waits longer than the lease before it does, so an agent
// that fences itself when its lease runs out has stopped its containers by
// then. See docs/failure-handling.md.
//
// Failures that the agent can act on carry a ProtocolError in the gRPC status
// details. See docs/protocol.md.
//
// Transport: outside loopback development the connection is mutual TLS. The
// manager derives the caller's identity from the client certificate and
// requires every node_id in a request to match it. Only enrolled nodes may
// register.
service NodeService {
  // RegisterNode is idempotent. Registering a node that already has a session
  // replaces that session; the older session is then SESSION_SUPERSEDED.
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // Heartbeat refreshes liveness, records workload status reports and returns
  // the desired workload set. It fails with NOT_REGISTERED or
  // SESSION_SUPERSEDED when the agent must register again.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // DeregisterNode ends a session. It is best effort and never required.
  rpc DeregisterNode(DeregisterNodeRequest) returns (DeregisterNodeResponse);
}

// ProtocolVersion identifies the wire protocol. A different major version is
// incompatible. A manager accepts an agent with the same major version and a
// minor version no newer than its own; an agent accepts a manager with the
// same major version.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// NodeIdentity names a node. node_id is chosen by the operator, must be stable
// across agent restarts and unique in the fleet.
message NodeIdentity {
  string node_id = 1;
  string name = 2;
  map<string, string> labels = 3;
  string agent_version = 4;
}

// NodeCapacity is the total resources the node offers, as declared by the agent.
message NodeCapacity {
  int64 cpu_millis = 1;
  int64 memory_bytes = 2;
}

// WorkloadDesiredState is the instruction the agent carries out for a workload.
enum WorkloadDesiredState {
  // Treated as RUNNING, which is what managers before protocol 1.2 meant.
  WORKLOAD_DESIRED_STATE_UNSPECIFIED = 0;
  // Create the container if the node has none, pulling the image if needed,
  // and keep it running according to the restart policy.
  WORKLOAD_DESIRED_STATE_RUNNING = 1;
  // Stop the container and remove it. The workload stays assigned, reported
  // as STOPPED with no container, until the manager deletes it.
  WORKLOAD_DESIRED_STATE_STOPPED = 2;
}

// PortMapping publishes one container port on the node.
message PortMapping {
  uint32 container_port = 1;
  // 0 lets the node choose a free port.
  uint32 host_port = 2;
  // "tcp" or "udp"; empty means tcp.
  string protocol = 3;
}

// RestartPolicy says when the agent starts a container that exited or turned
// unhealthy, how long it waits and when it gives up.
message RestartPolicy {
  // "no", "on-failure" or "always"; empty means "on-failure".
  string condition = 1;
  // How many restarts in a row are allowed. 0 means 5 for "on-failure" and no
  // limit for "always". The count starts again after the container has run
  // steadily for a while.
  uint32 max_retries = 2;
  // The wait before the second restart in a row (the first is immediate); it
  // doubles with each further restart up to max_backoff_seconds. 0 means 1.
  uint32 backoff_seconds = 3;
  // 0 means 60.
  uint32 max_backoff_seconds = 4;
}

// HealthCheck is run by Docker inside the container; exit status 0 is healthy.
message HealthCheck {
  // Exec form: the program and its arguments, never a shell string.
  repeated string command = 1;
  uint32 interval_seconds = 2;
  uint32 timeout_seconds = 3;
  // Failures in this period after the start do not count.
  uint32 start_period_seconds = 4;
  // Consecutive failures that make the container unhealthy.
  uint32 retries = 5;
}

// WorkloadAssignment is the instruction for one workload on the node. The
// workload_id identifies one container's lifetime: it is random, unique in the
// fleet and never reused, and it is the only thing that names the container
// on the node.
message WorkloadAssignment {
  string workload_id = 1;
  string name = 2;
  string image = 3;
  int64 cpu_millis = 4;
  int64 memory_bytes = 5;
  // Starts at 1 and increases every time desired_state changes. The agent
  // acknowledges the generation it has seen in WorkloadStatus.
  int64 generation = 6;
  WorkloadDesiredState desired_state = 7;
  // Replaces the image's default command; exec form.
  repeated string command = 8;
  map<string, string> env = 9;
  repeated PortMapping ports = 10;
  // Absent means the default, "on-failure" with 5 retries.
  RestartPolicy restart_policy = 11;
  // Absent means the container is not health checked.
  HealthCheck health_check = 12;
}

enum WorkloadPhase {
  WORKLOAD_PHASE_UNSPECIFIED = 0;
  // The agent accepted the assignment but has not started it.
  WORKLOAD_PHASE_PENDING = 1;
  WORKLOAD_PHASE_RUNNING = 2;
  WORKLOAD_PHASE_SUCCEEDED = 3;
  WORKLOAD_PHASE_FAILED = 4;
  WORKLOAD_PHASE_STOPPED = 5;
}

// WorkloadStatus is the agent's observation of one workload.
message WorkloadStatus {
  string workload_id = 1;
  WorkloadPhase phase = 2;
  string message = 3;
  // The highest generation of this workload's assignment the agent has
  // received. 0 from an agent that does not acknowledge.
  int64 acknowledged_generation = 4;
  // Docker's ID for the workload's container; empty when the node has none.
  string container_id = 5;
  // The exit code of a container that exited.
  optional int32 exit_code = 6;
  bool oom_killed = 7;
  // How many times the agent restarted the container since it started.
  int32 restart_count = 8;
  // The result of the container's health check: empty without one, else
  // "starting", "healthy" or "unhealthy".
  string health = 9;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  // The peer's protocol version is not supported. Do not retry.
  PROTOCOL_ERROR_CODE_INCOMPATIBLE_VERSION = 1;
  // The manager has no session for this node (for example after a restart).
  // Register again.
  PROTOCOL_ERROR_CODE_NOT_REGISTERED = 2;
  // A newer registration replaced this session. Register again.
  PROTOCOL_ERROR_CODE_SESSION_SUPERSEDED = 3;
  // The request is malformed or violates a limit. Do not retry unchanged.
  PROTOCOL_ERROR_CODE_INVALID_REQUEST = 4;
  // The node is not enrolled, or its enrollment was revoked. An administrator
  // must enroll the node; the agent may keep retrying.
  PROTOCOL_ERROR_CODE_NOT_ENROLLED = 5;
  // The node_id in the request differs from the identity in the client
  // certificate. Do not retry unchanged.
  PROTOCOL_ERROR_CODE_IDENTITY_MISMATCH = 6;
  // The client certificate is expired, not yet valid, or carries no node
  // identity. Renew it; a new connection picks up the renewed certificate.
  PROTOCOL_ERROR_CODE_CERTIFICATE_INVALID = 7;
}

// ProtocolError is attached to the gRPC status details of failed calls.
message ProtocolError {
  ProtocolErrorCode code = 1;
  string message = 2;
  // The sender's own protocol version, so the peer can report a useful mismatch.
  ProtocolVersion supported_version = 3;
}

message RegisterNodeRequest {
  ProtocolVersion protocol_version = 1;
  NodeIdentity identity = 2;
  NodeCapacity capacity = 3;
}

message RegisterNodeResponse {
  ProtocolVersion protocol_version = 1;
  // Opaque session token; send it with every Heartbeat and DeregisterNode.
  string session_id = 2;
  int64 heartbeat_interval_ms = 3;
  // The complete set of workloads assigned to the node right now.
  repeated WorkloadAssignment assignments = 4;
  // How long a successful Heartbeat keeps the session's lease, counted from
  // when the agent sent the request. 0 from a manager that grants none.
  int64 lease_ms = 5;
}

message HeartbeatRequest {
  string node_id = 1;
  string session_id = 2;
  // The complete set of workloads the agent knows about.
  repeated WorkloadStatus statuses = 3;
}

message HeartbeatResponse {
  // The complete set of workloads assigned to the node right now, running and
  // stopped. A workload leaves the list only when the manager deleted it after
  // the node confirmed that the container is gone.
  repeated WorkloadAssignment assignments = 1;
}

message DeregisterNodeRequest {
  string node_id = 1;
  string session_id = 2;
}

message DeregisterNodeResponse {}
